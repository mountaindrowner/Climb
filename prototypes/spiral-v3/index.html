<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>The Climb — spiral concept</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0d0b12; --panel:#16131d; --panel2:#1f1b28; --edge:#2f2a3c; --ink:#efe6d2; --dim:#968ca3;
  --gold:#e8b04a; --pool:#5ce1c6; --hurt:#d9483b; --btn:#231f2e; --btnTop:#352f45; --btnShadow:#09080c;
  color-scheme: dark;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  background:var(--bg);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0d0b12; --panel:#16131d; --panel2:#1f1b28; --edge:#2f2a3c; --ink:#efe6d2; --dim:#968ca3;
    --btn:#231f2e; --btnTop:#352f45; --btnShadow:#09080c;
  }
}
:root[data-theme="dark"]{
  --bg:#0d0b12; --panel:#16131d; --panel2:#1f1b28; --edge:#2f2a3c; --ink:#efe6d2; --dim:#968ca3;
  --btn:#231f2e; --btnTop:#352f45; --btnShadow:#09080c;
}
*,*::before,*::after{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  height:100%;margin:0;background:var(--bg);color:var(--ink);overflow:hidden;
  font-family:"Pixelify Sans",ui-rounded,"Trebuchet MS",system-ui,sans-serif;
  touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
  -webkit-tap-highlight-color:transparent;
}
#app{display:flex;flex-direction:column;height:100%;max-width:520px;margin:0 auto;position:relative}
#stage{flex:1;position:relative;min-height:0;overflow:hidden;background:#000}
#gl,#hud{position:absolute;inset:0;width:100%;height:100%;display:block}
#gl{image-rendering:pixelated;image-rendering:crisp-edges}
#hud{pointer-events:none}

#pad{
  flex:0 0 auto;height:clamp(160px,24vh,200px);display:grid;
  grid-template-columns:1fr 64px 1fr;gap:6px;padding:10px 12px 12px;
  background:linear-gradient(var(--panel2),var(--panel));border-top:3px solid var(--edge);
}
.col{position:relative;display:flex}
.left{flex-direction:column;gap:8px}
.mid{align-items:center;justify-content:center}
.right{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:6px}
.btn{
  font:inherit;color:var(--ink);background:var(--btn);border:0;border-radius:10px;
  box-shadow:inset 0 3px 0 var(--btnTop),0 5px 0 var(--btnShadow);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  touch-action:none;cursor:pointer;transition:transform .05s;padding:0;
}
.btn small{font-size:11px;color:var(--dim);margin-top:2px;letter-spacing:.02em}
.btn.on{transform:translateY(4px);box-shadow:inset 0 3px 0 var(--btnTop),0 1px 0 var(--btnShadow);background:#2d2839}
.btn:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.dir{flex:1;font-size:26px;line-height:1}
.round{border-radius:50%;font-size:28px;font-weight:700;aspect-ratio:1/1;max-height:100%;margin:auto;width:100%}
.b{grid-column:1;grid-row:1;color:#9fd0ff}
.a{grid-column:2;grid-row:2;color:#ffb38a}
.flask{width:58px;height:78px;font-size:13px;color:var(--pool)}
.flask .pips{font-size:16px;color:var(--pool);margin-top:4px;letter-spacing:1px}

#overlay{
  position:absolute;inset:0;display:none;align-items:center;justify-content:center;padding:18px;
  background:rgba(8,6,12,.82);z-index:5;overflow-y:auto;
}
#overlay.show{display:flex}
.card{width:100%;max-width:380px;text-align:center;margin:auto}
.card h1{font-size:44px;line-height:1;margin:6px 0 2px;letter-spacing:.01em;color:var(--ink);
  text-shadow:0 4px 0 #3a2b52, 0 8px 0 #1c1528}
.card h2{font-size:28px;margin:4px 0 6px}
.card .sub{color:var(--dim);font-size:15px;margin:0 0 14px;line-height:1.35}
.card p{font-size:15px;line-height:1.4;margin:6px 0}
.card .note{color:var(--dim);font-size:13px}
.card .gold{color:var(--gold)}
.card .pool{color:var(--pool)}
.card .bad{color:#ff8a78}
.grp{margin:14px 0 6px;color:var(--dim);font-size:13px;text-align:left}
.choice{
  width:100%;font:inherit;font-size:16px;color:var(--ink);background:var(--btn);border:2px solid var(--edge);
  border-radius:8px;padding:11px 12px;margin:5px 0;display:flex;justify-content:space-between;align-items:center;gap:10px;
  box-shadow:0 4px 0 var(--btnShadow);cursor:pointer;text-align:left;
}
.choice small{color:var(--dim);font-size:12px;display:block;margin-top:2px}
.choice .cost{color:var(--gold);white-space:nowrap}
.choice.sel{border-color:var(--gold);background:#2b2433}
.choice:disabled{opacity:.4}
.choice.go{background:#2c2440;border-color:#5a4a7a;justify-content:center;font-size:18px}
.choice:active{transform:translateY(3px);box-shadow:0 1px 0 var(--btnShadow)}
.choice:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.weps{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.weps .choice{flex-direction:column;align-items:flex-start;padding:9px 8px;font-size:14px}
.link{background:none;border:0;color:var(--dim);font:inherit;font-size:12px;text-decoration:underline;margin-top:14px;cursor:pointer}
.how{font-size:13px;color:var(--dim);text-align:left;background:var(--panel);border:2px solid var(--edge);border-radius:8px;padding:10px 12px;margin-top:14px;line-height:1.5}
.how b{color:var(--ink);font-weight:600}
</style>
</head>
<body>
<div id="app">
  <div id="stage">
    <canvas id="gl"></canvas>
    <canvas id="hud"></canvas>
    <div id="overlay" role="dialog" aria-live="polite"></div>
  </div>
  <div id="pad">
    <div class="col left">
      <button class="btn dir" data-k="up" aria-label="Jump or use">▲<small>jump · use</small></button>
      <button class="btn dir" data-k="down" aria-label="Duck">▼<small>duck</small></button>
    </div>
    <div class="col mid">
      <button class="btn flask" data-k="flask" aria-label="Drink flask">flask<span class="pips" id="pips">●●●</span></button>
    </div>
    <div class="col right">
      <button class="btn round b" data-k="b" aria-label="Block">B<small>block</small></button>
      <button class="btn round a" data-k="a" aria-label="Attack">A<small>attack</small></button>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(() => {
'use strict';
const $ = s => document.querySelector(s);
const overlay = $('#overlay'), pipsEl = $('#pips');
if (!window.THREE){
  overlay.innerHTML = '<div class="card"><h2>The 3D engine did not load</h2><p class="sub">Check your connection and reload the page.</p></div>';
  overlay.classList.add('show');
  return;
}
const glCanvas = $('#gl'), hud = $('#hud'), hx = hud.getContext('2d');

/* ---------------- constants ---------------- */
const F = 8, RISE = 0.75, LAND = 1.8, FL = F + LAND, FH = F * RISE, MPU = 1.5, ZF = 15;
const R = 7, OMEGA = 1 / R, RW = R + 1.8, RP = R - 1.3;
const ZONES = [
  {name:'The Deep', boss:'Warden of the Deep', bg:'#0b0912', wall:'#6a6280', stone:'#5a5470', top:'#7a7294', glow:'#a07cff'},
  {name:'The Flooded Halls', boss:'The Drowned Warden', bg:'#050d13', wall:'#4f7482', stone:'#3f5c6a', top:'#628a9a', glow:'#4fd1ff'},
  {name:'The Forge Galleries', boss:'The Forge Warden', bg:'#120705', wall:'#7a4a36', stone:'#64402f', top:'#8c5a42', glow:'#ff7a2f'},
  {name:'The Fungal Caverns', boss:'The Spore Warden', bg:'#06100a', wall:'#4f7556', stone:'#3e5c45', top:'#628c6a', glow:'#a6ff6b'},
  {name:'The Collapsed Workings', boss:'The Broken Warden', bg:'#0f0c08', wall:'#7a6e54', stone:'#5e5644', top:'#867a60', glow:'#ffd36b'},
  {name:'The Endless Stair', boss:'The Stair Warden', bg:'#090910', wall:'#6e6e88', stone:'#58586e', top:'#7e7e98', glow:'#d6e3ff'},
  {name:'The Peak', boss:'The Last Warden', bg:'#0b1222', wall:'#6a7496', stone:'#5a6282', top:'#8e97ba', glow:'#ffffff'},
];
const MAXK = ZONES.length * ZF;
const WEAPONS = {
  sword:{name:'Short sword', desc:'Fast, 1 dmg', dmg:1, cd:0.22, reach:1.7},
  pick:{name:'War pick', desc:'Slow, 2 dmg', dmg:2, cd:0.5, reach:1.6},
  spear:{name:'Spear', desc:'Long reach', dmg:1, cd:0.32, reach:2.5},
};
const zoneOf = k => Math.min(ZONES.length - 1, Math.max(0, Math.floor(k / ZF)));
const special = k => { const l = k % ZF; return l === 6 ? 'lift' : l === 10 ? 'camp' : l === 14 ? 'boss' : null; };
const landingS = k => k * FL + F + LAND * 0.5;
const meters = y => Math.max(0, Math.floor(y * MPU));
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const smooth = t => t * t * (3 - 2 * t);
const yawFor = a => -a - Math.PI / 2;

/* ---------------- persistence ---------------- */
const KEY = 'the-climb-spiral-v1';
let S = {best:0, lifts:[], bosses:[], falls:0, gold:0, stash:0, weapon:'sword'};
function load(){ try { const r = localStorage.getItem(KEY); if (r) S = Object.assign(S, JSON.parse(r)); } catch(e){} }
function save(){ try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e){} }
load();

function hash(a, b){ let h = (a * 374761393 + b * 668265263) | 0; h = (h ^ (h >>> 13)) * 1274126177; return ((h ^ (h >>> 16)) >>> 0) / 4294967295; }
function rng(seed){ let a = seed >>> 0; return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

/* ---------------- audio ---------------- */
let AC = null;
function ac(){ if (!AC){ try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch(e){} } if (AC && AC.state === 'suspended') AC.resume(); return AC; }
function tone(freq, dur, type, vol, slide){
  const a = AC; if (!a) return;
  const o = a.createOscillator(), g = a.createGain(), t = a.currentTime;
  o.type = type || 'square'; o.frequency.setValueAtTime(freq, t);
  if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(20, freq + slide), t + dur);
  g.gain.setValueAtTime(vol || 0.08, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g).connect(a.destination); o.start(t); o.stop(t + dur + 0.02);
}
let noiseBuf = null;
function noise(dur, vol, freq){
  const a = AC; if (!a) return;
  if (!noiseBuf){ noiseBuf = a.createBuffer(1, a.sampleRate, a.sampleRate); const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; }
  const s = a.createBufferSource(), f = a.createBiquadFilter(), g = a.createGain(), t = a.currentTime;
  s.buffer = noiseBuf; f.type = 'lowpass'; f.frequency.value = freq || 1200;
  g.gain.setValueAtTime(vol || 0.1, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  s.connect(f).connect(g).connect(a.destination); s.start(t); s.stop(t + dur + 0.02);
}
const sfx = {
  step(){ tone(72, 0.09, 'sine', 0.22, -30); noise(0.05, 0.05, 380); },
  jump(){ tone(260, 0.12, 'square', 0.04, 220); },
  slash(){ noise(0.09, 0.09, 2600); },
  hit(){ tone(170, 0.1, 'square', 0.07, -90); noise(0.06, 0.07, 1500); },
  clang(){ tone(620, 0.12, 'triangle', 0.06, -200); },
  parry(){ tone(1150, 0.16, 'triangle', 0.1, 600); tone(1700, 0.1, 'sine', 0.05, 300); },
  block(){ tone(300, 0.08, 'square', 0.05, -100); noise(0.05, 0.06, 900); },
  hurt(){ tone(120, 0.28, 'sawtooth', 0.09, -60); },
  gold(){ tone(900, 0.06, 'square', 0.035, 300); },
  crack(){ noise(0.25, 0.08, 700); },
  slam(){ tone(48, 0.45, 'sine', 0.35, -18); noise(0.35, 0.14, 300); },
  roar(){ tone(70, 0.9, 'sawtooth', 0.08, -30); noise(0.8, 0.06, 500); },
  spit(){ tone(420, 0.2, 'sawtooth', 0.05, -250); },
  splash(){ noise(0.8, 0.16, 900); tone(220, 0.5, 'sine', 0.06, 300); },
  fall(){ tone(500, 1.4, 'sine', 0.05, -440); },
  repair(){ tone(520, 0.08, 'square', 0.05, 0); setTimeout(() => tone(780, 0.12, 'square', 0.05, 0), 90); },
  drink(){ tone(340, 0.25, 'sine', 0.07, 260); },
};
function buzz(ms){ try { navigator.vibrate && navigator.vibrate(ms); } catch(e){} }

/* ---------------- three setup ---------------- */
const renderer = new THREE.WebGLRenderer({canvas: glCanvas, antialias: false, powerPreference: 'high-performance'});
const scene = new THREE.Scene();
const fogCol = new THREE.Color(ZONES[0].bg);
scene.background = fogCol.clone();
scene.fog = new THREE.FogExp2(fogCol.clone(), 0.052);
const camera = new THREE.PerspectiveCamera(72, 0.6, 0.1, 120);
let W = 300, H = 500, HDPR = 1;
function resize(){
  const r = $('#stage').getBoundingClientRect();
  W = Math.max(200, r.width); H = Math.max(200, r.height);
  const pr = clamp(600 / H, 0.4, 1.5);
  renderer.setPixelRatio(pr); renderer.setSize(W, H, false);
  camera.aspect = W / H; camera.fov = W / H > 1 ? 55 : 72; camera.updateProjectionMatrix();
  HDPR = Math.min(2, window.devicePixelRatio || 1);
  hud.width = Math.round(W * HDPR); hud.height = Math.round(H * HDPR);
  hx.setTransform(HDPR, 0, 0, HDPR, 0, 0);
}
window.addEventListener('resize', resize);
resize();

scene.add(new THREE.AmbientLight(0x8a84a8, 0.3));
const hemi = new THREE.HemisphereLight(0xa8a0d0, 0x141018, 0.28); scene.add(hemi);
const torch = new THREE.PointLight(0xffb36b, 1.8, 15, 2); scene.add(torch);
const poolLight = new THREE.PointLight(0x5ce1c6, 2, 34, 2); poolLight.position.set(0, 2.5, 0); scene.add(poolLight);
const fireLight = new THREE.PointLight(0xff8a3c, 0, 11, 2); scene.add(fireLight);

const geoCache = new Map(), matCache = new Map();
function bgeo(w, h, d){ const k = w + ',' + h + ',' + d; let g = geoCache.get(k); if (!g){ g = new THREE.BoxGeometry(w, h, d); geoCache.set(k, g); } return g; }
function lam(c){ const k = 'l' + c; let m = matCache.get(k); if (!m){ m = new THREE.MeshLambertMaterial({color: c}); matCache.set(k, m); } return m; }
function bas(c){ const k = 'b' + c; let m = matCache.get(k); if (!m){ m = new THREE.MeshBasicMaterial({color: c}); matCache.set(k, m); } return m; }
function mbox(w, h, d, mat, x, y, z){ const m = new THREE.Mesh(bgeo(w, h, d), mat); m.position.set(x || 0, y || 0, z || 0); return m; }
function placeArc(obj, a, r, y, flip){ obj.position.set(r * Math.cos(a), y, r * Math.sin(a)); obj.rotation.y = yawFor(a) + (flip ? Math.PI : 0); }
const vArc = (a, r, y, out) => (out || new THREE.Vector3()).set(r * Math.cos(a), y, r * Math.sin(a));

/* ----- textures ----- */
function canvasTex(w, h, draw){
  const c = document.createElement('canvas'); c.width = w; c.height = h; const g = c.getContext('2d'); draw(g, w, h);
  const t = new THREE.CanvasTexture(c); t.magFilter = THREE.NearestFilter; t.minFilter = THREE.NearestFilter; t.generateMipmaps = false;
  t.wrapS = t.wrapT = THREE.RepeatWrapping; return t;
}
const wallTex = canvasTex(256, 256, (g, w, h) => {
  const im = g.createImageData(w, h), d = im.data, rows = 16, bh = h / rows, bw = 32;
  for (let y = 0; y < h; y++){
    const r = Math.floor(y / bh), off = (r % 2) * bw / 2, yy = y - r * bh;
    for (let x = 0; x < w; x++){
      const cx = Math.floor((x + off) / bw), xx = (x + off) - cx * bw, bv = hash(r, cx);
      let v;
      if (yy < 2 || xx < 2) v = 26 + Math.random() * 14;
      else {
        v = 92 + bv * 58 + (hash(x >> 2, (y >> 2) + 7) - 0.5) * 30 + (Math.random() - 0.5) * 30;
        if (yy < 4) v += 16;
        if (yy > bh - 4 || xx > bw - 3) v *= 0.72;
      }
      if (hash(x >> 3, 3) > 0.78) v *= 0.62 + 0.38 * ((y % 96) / 96);
      const i = (y * w + x) * 4; d[i] = v; d[i + 1] = v * 0.97; d[i + 2] = v * 1.03; d[i + 3] = 255;
    }
  }
  g.putImageData(im, 0, 0);
  g.strokeStyle = 'rgba(12,10,14,0.85)'; g.lineWidth = 1;
  for (let c = 0; c < 9; c++){ let x = Math.random() * w, y = Math.random() * h; g.beginPath(); g.moveTo(x, y); for (let q = 0; q < 7; q++){ x += (Math.random() - 0.5) * 18; y += Math.random() * 12; g.lineTo(x, y); } g.stroke(); }
  for (let c = 0; c < 14; c++){ const x = (Math.random() * w) | 0, y = (Math.random() * h) | 0; g.fillStyle = '#ffffff'; g.fillRect(x, y, 3, 3); g.fillRect(x + 3, y + 2, 2, 2); }
  g.clearRect(48, 44, 36, 58);
  g.clearRect(52, 38, 28, 8);
  g.clearRect(58, 34, 16, 6);
});
const stoneTex = canvasTex(64, 64, (g, w, h) => {
  const im = g.createImageData(w, h), d = im.data;
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++){
    let v = 160 + (hash(x >> 3, y >> 3) - 0.5) * 50 + (hash(x >> 1, (y >> 1) + 99) - 0.5) * 30 + (Math.random() - 0.5) * 36;
    const e = Math.min(x, y, w - 1 - x, h - 1 - y);
    if (e < 2) v *= 0.55; else if (e < 4) v *= 0.8;
    const i = (y * w + x) * 4; d[i] = v; d[i + 1] = v * 0.98; d[i + 2] = v * 1.04; d[i + 3] = 255;
  }
  g.putImageData(im, 0, 0);
  g.strokeStyle = 'rgba(18,14,22,0.85)'; g.lineWidth = 1;
  for (let c = 0; c < 3; c++){ let x = Math.random() * w, y = Math.random() * h; g.beginPath(); g.moveTo(x, y); for (let q = 0; q < 6; q++){ x += (Math.random() - 0.5) * 14; y += (Math.random() - 0.3) * 10; g.lineTo(x, y); } g.stroke(); }
  for (let c = 0; c < 8; c++){ g.fillStyle = 'rgba(14,10,16,0.75)'; g.fillRect((Math.random() * w) | 0, (Math.random() * h) | 0, 2, 2); }
});
const grimeTex = canvasTex(32, 32, (g, w, h) => {
  const im = g.createImageData(w, h), d = im.data;
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++){
    const v = 200 + (hash(x >> 2, y >> 2) - 0.5) * 60 + (Math.random() - 0.5) * 50;
    const i = (y * w + x) * 4; d[i] = d[i + 1] = d[i + 2] = clamp(v, 0, 255); d[i + 3] = 255;
  }
  g.putImageData(im, 0, 0);
});
const outerTex = canvasTex(64, 64, (g, w, h) => {
  g.fillStyle = '#1a1820'; g.fillRect(0, 0, w, h);
  for (let r = 0; r < 4; r++) for (let c = 0; c < 3; c++){
    const v = hash(r + 40, c); const l = 46 + Math.floor(v * 30);
    g.fillStyle = `rgb(${l},${l},${l + 8})`; g.fillRect(c * 22 + (r % 2) * 10 + 1, r * 16 + 1, 20, 14);
    if (v > 0.85){ g.fillStyle = '#ffffff'; g.fillRect(c * 22 + 8, r * 16 + 6, 2, 2); }
  }
});
const chainTex = canvasTex(16, 32, (g) => {
  g.clearRect(0, 0, 16, 32);
  g.fillStyle = '#4a4552'; g.fillRect(4, 1, 8, 14); g.clearRect(6, 3, 4, 10);
  g.fillStyle = '#3a3542'; g.fillRect(7, 15, 2, 17);
});
const silTex = canvasTex(128, 192, (g) => {
  g.clearRect(0, 0, 128, 192);
  g.fillStyle = '#000';
  g.fillRect(34, 40, 60, 80); g.fillRect(48, 14, 32, 28); g.fillRect(14, 44, 20, 70); g.fillRect(94, 44, 20, 70);
  g.fillRect(40, 120, 18, 60); g.fillRect(70, 120, 18, 60);
  g.fillStyle = '#ffffff'; g.fillRect(54, 26, 6, 4); g.fillRect(68, 26, 6, 4);
});
silTex.wrapS = silTex.wrapT = THREE.ClampToEdgeWrapping;

/* ----- shaft: wall, outer caverns, floor, pool ----- */
const TOTAL_H = MAXK * FH + 30;
function zoneColorAtY(y, key, f){ const z = ZONES[zoneOf(Math.floor(y / FH))]; return new THREE.Color(z[key]).multiplyScalar(f); }
function shaftCylinder(radius, tex, repU, key, f, alphaTest){
  const segs = MAXK + 4;
  const geo = new THREE.CylinderGeometry(radius, radius, TOTAL_H, 72, segs, true);
  geo.translate(0, TOTAL_H / 2 - 10, 0);
  const pos = geo.attributes.position, cols = new Float32Array(pos.count * 3);

/* ---------------- geometry of the path ---------------- */
function posOf(s){
  if (s < 0) s = 0;
  const k = Math.floor(s / FL), t = s - k * FL, base = k * FH, a = s * OMEGA;
  if (t < F){
    const i = Math.floor(t), fr = t - i, e = smooth(Math.min(1, fr / 0.42));
    return {k, t, i, fr, a, y: base + RISE * (i + e), land: false};
  }
  return {k, t, i: -1, fr: 0, a, y: base + FH, land: true, u: (t - F) / LAND};
}
function topAt(s){ const k = Math.floor(s / FL), t = s - k * FL; return t < F ? k * FH + (Math.floor(t) + 1) * RISE : k * FH + FH; }

function gen(k){
  const r = rng(runSeed * 7919 + k * 104729);
  const c = {k, obs: [], gold: [], gaps: new Set(), sp: special(k), extras: []};
  const base = k * FL, z = zoneOf(k);
  const add = (type, t, extra) => {
    if (type === 'gap' || type === 'beam') t = Math.floor(t) + (type === 'gap' ? 0.25 : 0.5);
    const o = Object.assign({type, s: base + t, k, alive: true, done: false, st: 'idle', tm: 0, hp: 1, flash: 0, dead: 0}, extra || {});
    if (type === 'gap') c.gaps.add(Math.floor(t));
    c.obs.push(o); return o;
  };
  if (k === 1) add('gap', 4.3, {hint:'Tap ▲ to jump the broken step'});
  else if (k === 2) add('beam', 4.5, {hint:'Tap ▼ to duck under the beam'});
  else if (k === 3) add('crawler', 5.3, {hint:'Tap A before it lunges. Late? Tap B to block it, then strike.'});
  else if (k === 4) add('spitter', 4.6, {hint:'Tap B to block. Tap it right as the spit lands to parry.'});
  else if (k >= 5 && c.sp !== 'boss'){
    const n = 1 + (r() < 0.55 ? 1 : 0) + (z > 0 ? 1 : 0);
    let t = 1.2;
    const types = z === 0 ? ['gap','beam','crawler','crawler','spitter'] : ['gap','beam','crawler','crawler','spitter','spitter'];
    for (let j = 0; j < n; j++){
      t += 0.8 + r() * 1.4;
      if (t > 7.2) break;
      const ty = types[(r() * types.length) | 0];
      add(ty, t, {hp: ty === 'crawler' ? (z >= 2 ? 2 : 1) : 1});
      t += 1.5;
    }
  } else if (c.sp === 'boss'){
    add('crawler', 3.4, {hp: 1});
  }
  const ng = 1 + ((r() * 2) | 0);
  for (let j = 0; j < ng; j++){
    const i = 1 + ((r() * 6) | 0);
    if (!c.gaps.has(i)) c.gold.push({s: base + i + 0.6, taken: false});
  }
  return c;
}

const waves = [0, 1, 2].map(() => { const m = mbox(0.4, 0.8, 2.4, lam(0x8a84a0)); m.visible = false; scene.add(m); return m; });

let hitstop = 0;

/* ---------------- state ---------------- */
let mode = 'title', time = 0, last = 0, slowmo = 1;

const floats = [];

       jump: 0, duck: 0, block: 0, lastBlock: -9, atk: 0, atkCd: 0, inv: 0, squash: 0, thudId: null, stumble: 0,

function setToast(text, sub, dur){ toast = {text, sub: sub || '', t: 0, dur: dur || 2.2}; }

/* ---------------- actions ---------------- */
function hurt(n, msg){

function drink(){

/* ---------------- climb update ---------------- */
function updClimb(dt){
  const p0 = posOf(G.s), z = zoneOf(p0.k);
  let spd = 2.25 + 0.12 * z;
  if (G.stumble > 0) spd *= 0.35;
  if (G.engaged) spd *= 0.25;
  G.engaged = false;
  if (p0.land && special(p0.k) === 'lift' && !S.lifts.includes(p0.k)) spd *= 0.4;
  G.prevS = G.s; G.s += spd * dt;
  const ls = landingS(p0.k);
  if (G.prevS < ls && G.s >= ls){
    const sp = special(p0.k);
    if (sp === 'camp' && !G.campDone.has(p0.k)){ G.s = ls; G.campDone.add(p0.k); S.gold = G.gold; save(); openCamp(p0.k); return; }
    if (sp === 'boss' && !S.bosses.includes(p0.k)){ G.s = ls; startBoss(p0.k); return; }
  }
  const p = posOf(G.s);
  if (zoneOf(p.k) !== G.zoneShown){ G.zoneShown = zoneOf(p.k); setToast(ZONES[G.zoneShown].name, 'Zone ' + (G.zoneShown + 1) + ' of ' + ZONES.length, 2.6); }
  const tid = p.land ? 'L' + p.k : p.k * 100 + p.i;
  if ((p.land || p.fr >= 0.42) && G.thudId !== tid){
    G.thudId = tid;
    if (G.jump <= 0){ G.squash = 1; dip = 0.14; sfx.step(); burst(vArc(p.a, R, p.y + 0.05), 5, '#b4aac8', 1.2, 4, 0.08); }
  }
  hint = null;
  for (let kk = p.k - 1; kk <= p.k + 2; kk++){
    if (kk < 0 || kk >= MAXK) continue;
    const c = C(kk);
    for (const o of c.obs){ updObs(o, dt); if (mode !== 'climb') return; }
    for (const g of c.gold){
      if (!g.taken && G.prevS < g.s && G.s >= g.s){ g.taken = true; G.gold++; sfx.gold(); burst(g.m.position, 6, '#e8b04a', 2); }
    }
  }
  const lp = posOf(G.s);
  if (lp.land && special(lp.k) === 'lift' && !S.lifts.includes(lp.k)) hint = 'Tap ▲ to repair the lift. It becomes a shortcut from the Pool.';
  const m = meters(lp.y); if (m > S.best) S.best = m;
}
function updObs(o, dt){
  const d = o.s - G.s;
  if (o.hint && !o.done && o.alive && d > -0.2 && d < 4) hint = o.hint;
  o.flash = Math.max(0, o.flash - dt);
  switch (o.type){
    case 'gap':
      if (!o.done && G.prevS < o.s && G.s >= o.s){ o.done = true; if (G.jump <= 0){ G.stumble = 0.4; hurt(1, 'Stumbled'); } }
      break;
    case 'beam':
      if (!o.done && G.prevS < o.s && G.s >= o.s){ o.done = true; if (G.duck <= 0) hurt(1, 'Smack'); }
      break;
    case 'crawler':
      if (!o.alive){ o.dead += dt; break; }
      if (o.st === 'idle' && d < 4.8){ o.st = 'crack'; o.tm = 0; sfx.crack(); }
      if (o.st === 'crack'){ o.tm += dt; if (d < 3.2 || o.tm > 1.2){ o.st = 'out'; o.tm = 0; burst(vArc(o.s * OMEGA, RW - 0.4, topAt(o.s) + 0.5), 14, '#7a7294', 3); } }
      if (o.st === 'out'){ o.tm += dt; o.s -= 0.45 * dt; if (o.s - G.s < 1.7){ o.st = 'windup'; o.tm = 0; sfx.spit(); } }
      else if (o.st === 'windup'){
        o.tm += dt; if (d < 2.4) G.engaged = true;
        if (o.tm >= 0.5){
          o.s -= 0.35; sfx.hit();
          if (G.block > 0){ o.st = 'stunned'; o.tm = 0; o.s += 0.9; sfx.block(); float('Blocked', head(), '#c9d2e0'); hitstop = 0.06; burst(head(1.2), 8, '#c9d2e0', 2); }
          else { o.st = 'spent'; hurt(1, 'Bitten'); if (mode !== 'climb') return; o.alive = false; o.dead = 0; o.done = true; }
        }
      }
      else if (o.st === 'stunned'){ o.tm += dt; if (d < 2.4) G.engaged = true; if (o.tm > 0.7){ o.st = 'windup'; o.tm = 0; } }
      if (o.alive && o.s - G.s < 0.3){ o.alive = false; o.dead = 0; o.done = true; hurt(1, 'Bitten'); }
      break;
    case 'spitter':
      if (!o.alive){ o.dead += dt; break; }
      if (o.st === 'idle' && d < 3.7){ o.st = 'charge'; o.tm = 0; }
      if (o.st === 'charge'){ o.tm += dt; if (o.tm >= 0.6){ o.st = 'fired'; o.tm = 0; o.orb = {t: 0, dur: 0.62}; sfx.spit(); } }
      if (o.st === 'fired'){ o.orb.t += dt; if (o.orb.t >= o.orb.dur) resolveOrb(o); }
      if (o.st === 'reflect'){
        o.orb.t += dt;
        if (o.orb.t >= o.orb.dur){ o.alive = false; o.dead = 0; o.done = true; o.orb = null; const sp = o.m.position.clone(); burst(sp, 16, o.glow, 4); G.gold += 4; float('+4', sp, '#e8b04a'); sfx.hit(); }
      }
      break;
  }
}
function resolveOrb(o){
  const since = time - G.lastBlock;
  if (G.block > 0 && since <= 0.2){
    o.st = 'reflect'; o.orb = {t: 0, dur: 0.28, back: true, from: head(1.2)};
    sfx.parry(); flash = -0.25; hitstop = 0.12; float('Parry!', head(), '#9fd0ff'); burst(head(1.2), 14, '#9fd0ff', 3);
  } else if (G.block > 0){
    o.st = 'spent'; o.orb = null; o.done = true; sfx.block(); float('Blocked', head(), '#c9d2e0'); burst(head(1.2), 6, '#c9d2e0', 2);
  } else { o.st = 'spent'; o.orb = null; o.done = true; hurt(1, 'Hit'); }
}

/* ---------------- boss ---------------- */
function startBoss(k){
  const z = zoneOf(k), ls = landingS(k);
  const model = makeBoss(z);
  B = {k, z, name: ZONES[z].boss, hp: 12 + 5 * z, max: 12 + 5 * z, phase: 1, st: 'intro', tm: 0, atk: null, queue: [], T: 1,
       a: ls * OMEGA + 0.55, y: k * FH + FH, r: R - 0.9, flash: 0, orb: null, stg: 1.4, model, slammed: false};
  placeArc(model.G, B.a, B.r, B.y, true); scene.add(model.G);
  mode = 'boss'; sfx.roar(); shake = 0.4;
  setToast(B.name, 'Read the wind-up. Strike when it kneels.', 2.6);
}
function bossGo(st, extra){ B.st = st; B.tm = 0; if (extra != null) B.stg = extra; }
function bossNext(){
  if (!B.queue.length){
    const pick = () => ['slam','sweep','spit'][(Math.random() * 3) | 0];
    B.queue.push(pick());
    if (B.phase === 2 && Math.random() < 0.55) B.queue.push(pick());
  }
  B.atk = B.queue.shift();
  B.T = B.phase === 1 ? Math.max(0.75, 1.15 - 0.06 * B.z) : Math.max(0.5, 0.78 - 0.04 * B.z);
  bossGo('tele');
}
function updBoss(dt){
  B.tm += dt; B.flash = Math.max(0, B.flash - dt);
  switch (B.st){
    case 'intro': if (B.tm > 2) bossGo('idle'); break;
    case 'idle': if (B.tm > (B.queue.length ? 0.25 : (B.phase === 1 ? 0.75 : 0.45))) bossNext(); break;
    case 'tele':
      if (B.atk === 'slam' && B.tm >= B.T - 0.3 && !B.slammed){ B.slammed = true; sfx.slam(); shake = 0.3; }
      if (B.tm >= B.T){
        B.slammed = false;
        if (B.atk === 'spit'){ B.orb = {t: 0, dur: 0.5}; sfx.spit(); bossGo('orb'); }
        else {
          const ok = B.atk === 'slam' ? G.jump > 0 : G.duck > 0;
          if (ok) float('Dodged', head(), '#c9f5d9');
          else { hurt(B.atk === 'slam' ? 2 : 1, B.atk === 'slam' ? 'Crushed' : 'Swept'); if (mode !== 'boss') return; }
          bossGo('strike');
        }
      }
      break;
    case 'orb':
      B.orb.t += dt;
      if (B.orb.t >= B.orb.dur){
        const since = time - G.lastBlock;
        if (G.block > 0 && since <= 0.2){ B.orb = {t: 0, dur: 0.28, back: true}; sfx.parry(); flash = -0.25; hitstop = 0.12; float('Parry!', head(), '#9fd0ff'); bossGo('reflect'); }
        else if (G.block > 0){ B.orb = null; sfx.block(); float('Blocked', head(), '#c9d2e0'); bossGo('strike'); }
        else { B.orb = null; hurt(1, 'Burned'); if (mode !== 'boss') return; bossGo('strike'); }
      }
      break;
    case 'reflect':
      B.orb.t += dt;
      if (B.orb.t >= B.orb.dur){ B.orb = null; damageBoss(3, 'Reflected'); if (B && B.st !== 'dying') bossGo('stagger', (B.phase === 1 ? 1.5 : 1.1) + 0.5); }
      break;
    case 'strike': if (B.tm > 0.35){ if (B.queue.length) bossGo('idle'); else bossGo('stagger', B.phase === 1 ? 1.5 : 1.1); } break;
    case 'stagger': if (B.tm > B.stg) bossGo('idle'); break;
    case 'dying': if (B.tm > 2.2) bossDefeated(); break;
  }
}
function bossTop(){ return vArc(B.a, B.r, B.y + 6.3); }
function bossHit(dmg){
  if (!B || B.st === 'dying' || B.st === 'intro') return;
  if (B.st === 'stagger') damageBoss(dmg);
  else { sfx.clang(); float('Clang', bossTop(), '#968ca3'); }
}
function damageBoss(n, txt){
  B.hp -= n; B.flash = 0.12; sfx.hit(); shake = Math.max(shake, 0.2);
  burst(vArc(B.a - 0.12, B.r, B.y + 2.8), 14, '#ffd9a8', 4); hitstop = 0.06;
  float(txt || ('-' + n), bossTop(), '#ffd9a8');
  if (B.hp <= 0){ B.hp = 0; bossGo('dying'); sfx.roar(); shake = 0.6; return; }
  if (B.phase === 1 && B.hp <= B.max / 2){ B.phase = 2; B.queue = []; shake = 0.4; sfx.roar(); setToast('It stops warning you', 'Watch its body, not the prompts', 2.2); }
}
function removeBoss(){ if (B && B.model) scene.remove(B.model.G); bossOrb.visible = false; waves.forEach(w => w.visible = false); slamStrip.forEach(m => m.visible = false); sweepBand.forEach(m => m.visible = false); bossAim.visible = false; }
function bossDefeated(){
  const g = 25 + 10 * B.z; G.gold += g;
  burst(vArc(B.a, B.r, B.y + 1.5), 40, ZONES[B.z].glow, 6);
  S.bosses.push(B.k); S.gold = G.gold; save();
  const name = B.name, h = meters(B.y);
  removeBoss(); B = null; mode = 'menu';
  setAllFlights();
  showMenu(`<div class="card"><h2>${name} falls</h2>
    <p class="gold">+${g} gold</p>
    <p>A lift now runs from the Pool to ${h} m.</p>
    <p class="note">The stair above is open.</p>
    <button class="choice go" data-act="resume">Keep climbing</button></div>`);
}

/* ---------------- falling ---------------- */
function startFall(){
  const pw = playerWorld(), p = posOf(G.s);
  const ledges = [];
  for (let n = 1; ; n++){
    const s = G.s - n * Math.PI * 2 * R;
    if (s < 3) break;
    ledges.push({s, y: topAt(s) + 0.2, id: n});
  }
  while (rootGroup.children.length) rootGroup.remove(rootGroup.children[0]);
  for (const L of ledges){
    const g = new THREE.Group(), mat = new THREE.MeshLambertMaterial({color: 0x6a4a32, emissive: 0x000000});
    for (let j = 0; j < 4; j++){ const m = mbox(0.32, 0.26, 0.5, mat, 0, Math.sin(j * 1.7) * 0.08, -j * 0.42); m.rotation.x = Math.sin(j) * 0.3; g.add(m); }
    placeArc(g, L.s * OMEGA, R - 1.25, L.y); rootGroup.add(g); L.g = g; L.mat = mat;
  }
  FALL = {y: pw.y, a: p.a, r: R, v: 2, y0: pw.y, vmax: Math.max(16, pw.y / 2.3), ledges, tried: new Set(), spin: 0};
  mode = 'fall'; removeBoss(); B = null; sfx.fall(); hint = null;
  setToast('You fall', 'Grab a root with ▲ as it passes', 2);
}
function grab(){
  if (G.grabCd > 0) return;
  G.grabCd = 0.45;
  for (const L of FALL.ledges){
    if (FALL.tried.has(L.id)) continue;
    if (Math.abs(FALL.y - L.y) < 1.4){
      G.s = L.s; G.prevS = L.s; G.hp = Math.max(1, Math.ceil(G.maxHp / 3)); G.inv = 1.2; G.jump = 0; G.duck = 0;
      G.thudId = null; mode = 'climb'; slowmo = 1;
      const lost = meters(FALL.y0) - meters(L.y);
      FALL = null; sfx.block(); shake = 0.3;
      while (rootGroup.children.length) rootGroup.remove(rootGroup.children[0]);
      setToast('Caught a root', 'Lost ' + lost + ' m', 2);
      return;
    }
  }
  float('Missed', vArc(FALL.a, FALL.r, FALL.y + 1.5), '#968ca3');
}
function updFall(dt){
  let near = false;
  for (const L of FALL.ledges){
    if (FALL.tried.has(L.id)) continue;
    const d = FALL.y - L.y;
    const hot = Math.abs(d) < 1.4;
    L.mat.emissive.setHex(hot ? 0xb07a22 : 0x000000);
    if (d > -1.4 && d < 3.4) near = true;
    if (FALL.y < L.y - 1.4){ FALL.tried.add(L.id); L.mat.emissive.setHex(0); }
  }
  slowmo = near ? 0.3 : 1;
  const ddt = dt * slowmo;
  FALL.v = Math.min(FALL.vmax, FALL.v + 34 * ddt);
  FALL.y -= FALL.v * ddt; FALL.spin += ddt * 7;
  FALL.r += (R - 2.4 - FALL.r) * Math.min(1, ddt * 4);
  if (FALL.y <= -0.1){
    FALL.y = -0.1; slowmo = 1; sfx.splash(); shake = 0.4;
    burst(vArc(FALL.a, FALL.r, 0), 40, '#5ce1c6', 6, 8);
    const lost = G.gold - Math.floor(G.gold / 2);

  const a0 = B.a - 0.2, a1 = pa - 0.06;
  slamStrip.forEach((m, i) => { const on = warn > 0 && B.atk === 'slam'; m.visible = on; if (on){ placeArc(m, a0 + (a1 - a0) * (i + 0.5) / slamStrip.length, R - 0.3, B.y + 0.04); } });
  slamMat.opacity = B.atk === 'slam' ? (0.12 + 0.5 * warn) * pulse : 0;
  sweepBand.forEach((m, i) => { const on = warn > 0 && B.atk === 'sweep'; m.visible = on; if (on){ placeArc(m, a0 + (a1 - a0) * (i + 0.5) / sweepBand.length, R - 1.4, B.y + 2.05); } });
  sweepMat.opacity = B.atk === 'sweep' ? (0.12 + 0.45 * warn) * pulse : 0;
  if (warn > 0 && B.atk === 'spit'){
    const from = vArc(B.a - 0.12, B.r, B.y + 4.3), to = head(1.2);
    bossAim.visible = true; bossAim.position.lerpVectors(from, to, 0.5); bossAim.lookAt(to); bossAim.scale.z = from.distanceTo(to);
    aimMat.color.setHex(M.glow); aimMat.opacity = (0.15 + 0.55 * warn) * pulse;
  } else bossAim.visible = false;
  // shockwave rolling from the boss to the player
  if (B.st === 'tele' && B.atk === 'slam' && slammed){
    const q = clamp((B.tm - (B.T - 0.3)) / 0.3, 0, 1);
    waves.forEach((w, i) => { const a = a0 + (pa - a0) * clamp(q - i * 0.12, 0, 1); w.visible = q - i * 0.12 > 0; placeArc(w, a, R - 0.3, B.y + 0.5 - i * 0.1); w.scale.set(1.3, 1.4 - i * 0.3, 1.2); if (Math.random() < 0.5) burst(w.position, 1, '#8a84a0', 2, 8, 0.12); });
  } else waves.forEach(w => w.visible = false);
  if (B.orb){
    bossOrb.visible = true;
    const q = B.orb.t / B.orb.dur, mouthP = vArc(B.a - 0.12, B.r, B.y + 4.3), hp = head(1.2);
    if (B.orb.back) bossOrb.position.lerpVectors(hp, mouthP, q);
    else { bossOrb.position.lerpVectors(mouthP, hp, q); bossOrb.position.y += Math.sin(q * Math.PI) * 1.2; }
    bossOrb.material.color.setHex(B.orb.back ? 0x9fd0ff : M.glow); bossOrb.rotation.y += 0.3;
  } else bossOrb.visible = false;
}

/* ---------------- HUD ---------------- */
function toScreen(p){ _v.copy(p).project(camera); return {x: (_v.x + 1) / 2 * W, y: (1 - _v.y) / 2 * H, ok: _v.z < 1}; }
function wrap(text, maxW){
  const words = text.split(' '), lines = []; let cur = '';
  for (const w of words){ const t = cur ? cur + ' ' + w : w; if (hx.measureText(t).width > maxW && cur){ lines.push(cur); cur = w; } else cur = t; }
  if (cur) lines.push(cur); return lines;
}
function drawTiming(label, t, dur){
  const s = toScreen(head(3.2)); if (!s.ok) return;
  const q = clamp(t / dur, 0, 1), r = 14 + (1 - q) * 34;
  hx.strokeStyle = 'rgba(239,230,210,0.9)'; hx.lineWidth = 2; hx.beginPath(); hx.arc(s.x, s.y, r, 0, 7); hx.stroke();
  hx.strokeStyle = 'rgba(232,176,74,0.95)'; hx.beginPath(); hx.arc(s.x, s.y, 14, 0, 7); hx.stroke();
  hx.fillStyle = '#efe6d2'; hx.font = '700 16px "Pixelify Sans", sans-serif'; hx.textAlign = 'center'; hx.textBaseline = 'middle';
  hx.fillText(label, s.x, s.y + 1); hx.textAlign = 'left'; hx.textBaseline = 'alphabetic';
}
function drawMeter(y){
  const zk = zoneOf(Math.floor(y / FH)), k0 = zk * ZF, k1 = k0 + 14;
  const y0 = k0 * FH, y1 = k1 * FH + FH;
  const X = W - 14, T = 64, Bm = H - 70;
  const map = v => Bm - clamp((v - y0) / (y1 - y0), 0, 1) * (Bm - T);
  hx.fillStyle = 'rgba(9,8,12,0.6)'; hx.fillRect(X - 3, T - 4, 6, Bm - T + 8);
  hx.fillStyle = '#3a3448'; hx.fillRect(X - 1, T, 2, Bm - T);
  const lk = k0 + 6, ck = k0 + 10;
  hx.fillStyle = S.lifts.includes(lk) ? '#e8b04a' : '#6b6378'; hx.fillRect(X - 5, map(lk * FH + FH) - 3, 10, 6);
  hx.fillStyle = '#ff9a3c'; hx.fillRect(X - 4, map(ck * FH + FH) - 4, 8, 8);
  hx.fillStyle = S.bosses.includes(k1) ? '#6b6378' : '#d9483b'; hx.fillRect(X - 6, T - 6, 12, 12);
  hx.fillStyle = '#09080c'; hx.fillRect(X - 3, T - 3, 2, 2); hx.fillRect(X + 1, T - 3, 2, 2);
  if (S.best > 0){ const by = map(S.best / MPU); hx.fillStyle = 'rgba(239,230,210,0.6)'; hx.fillRect(X - 7, by, 14, 2); }
  const py = map(y);
  hx.fillStyle = '#efe6d2'; hx.beginPath(); hx.moveTo(X - 12, py - 5); hx.lineTo(X - 5, py); hx.lineTo(X - 12, py + 5); hx.fill();
}
const grainC = document.createElement('canvas'); grainC.width = grainC.height = 96;
(() => { const g = grainC.getContext('2d'), im = g.createImageData(96, 96), d = im.data; for (let i = 0; i < d.length; i += 4){ const v = Math.random() * 255; d[i] = d[i + 1] = d[i + 2] = v; d[i + 3] = 255; } g.putImageData(im, 0, 0); })();
let grainPat = null;
function drawIcon(p, label, color){
  const s = toScreen(p); if (!s.ok) return;
  const pz = 1 + 0.12 * Math.sin(time * 14);
  hx.fillStyle = 'rgba(9,8,12,0.78)'; hx.beginPath(); hx.arc(s.x, s.y, 15 * pz, 0, 7); hx.fill();
  hx.strokeStyle = color; hx.lineWidth = 2.5; hx.stroke();
  hx.fillStyle = color; hx.font = '700 16px "Pixelify Sans", sans-serif'; hx.textAlign = 'center'; hx.textBaseline = 'middle';
  hx.fillText(label, s.x, s.y + 1); hx.textAlign = 'left'; hx.textBaseline = 'alphabetic';
}
function drawHUD(){
  hx.clearRect(0, 0, W, H);
  const vg = hx.createRadialGradient(W / 2, H * 0.48, Math.min(W, H) * 0.32, W / 2, H * 0.5, Math.max(W, H) * 0.72);
  vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,0.6)');
  hx.fillStyle = vg; hx.fillRect(0, 0, W, H);
  if (!grainPat) grainPat = hx.createPattern(grainC, 'repeat');
  hx.save(); hx.globalAlpha = 0.06; hx.globalCompositeOperation = 'overlay';
  hx.translate((Math.random() * 96) | 0, (Math.random() * 96) | 0); hx.fillStyle = grainPat; hx.fillRect(-96, -96, W + 192, H + 192);
  hx.restore();
  hx.textBaseline = 'alphabetic';
  if (flash > 0){ hx.fillStyle = `rgba(217,72,59,${flash * 0.55})`; hx.fillRect(0, 0, W, H); }
  else if (flash < 0){ hx.fillStyle = `rgba(159,208,255,${-flash * 0.55})`; hx.fillRect(0, 0, W, H); }
  if (slowmo < 1){ hx.fillStyle = 'rgba(232,176,74,0.07)'; hx.fillRect(0, 0, W, H); }
  if (G && mode !== 'title'){
    for (let i = 0; i < G.maxHp; i++){
      const x = 12 + i * 20, y = 12;
      hx.fillStyle = '#09080c'; hx.fillRect(x, y + 3, 16, 16);
      hx.fillStyle = i < G.hp ? '#d9483b' : '#3a2f3a'; hx.fillRect(x, y, 16, 16);
      if (i < G.hp){ hx.fillStyle = '#ff8a78'; hx.fillRect(x + 3, y + 3, 5, 4); }
    }
    hx.font = '600 15px "Pixelify Sans", sans-serif';
    hx.fillStyle = '#e8b04a'; hx.fillText('◆ ' + G.gold, 12, 48);
    hx.fillStyle = '#5ce1c6'; hx.fillText('flask ' + G.flask, 64, 48);
    const y = mode === 'fall' && FALL ? FALL.y : mode === 'pool' ? 0 : posOf(G.s).y;
    hx.textAlign = 'right';
    hx.fillStyle = '#09080c'; hx.font = '700 28px "Pixelify Sans", sans-serif'; hx.fillText(meters(y) + ' m', W - 30, 36);
    hx.fillStyle = '#efe6d2'; hx.fillText(meters(y) + ' m', W - 30, 34);
    hx.fillStyle = '#968ca3'; hx.font = '400 13px "Pixelify Sans", sans-serif'; hx.fillText('best ' + S.best + ' m', W - 30, 50);
    hx.textAlign = 'left';
    drawMeter(y);
  }
  if (G && mode === 'climb'){
    for (const c of content.values()) for (const o of c.obs){
      const d = o.s - G.s;
      if (o.type === 'spitter' && o.orb && !o.orb.back) drawTiming('B', o.orb.t, o.orb.dur);
      if (o.type === 'spitter' && o.alive && o.st === 'charge') drawIcon(o.m.position.clone().setY(o.m.position.y + 1.0), '!', '#ff6b5a');
      if (o.done || d <= 0 || d > 3.8) continue;
      if (o.type === 'gap') drawIcon(vArc(o.s * OMEGA, R - 0.4, topAt(o.s) + 0.7), '▲', '#e8b04a');
      else if (o.type === 'beam') drawIcon(vArc(o.s * OMEGA, R - 1.2, topAt(o.s) + 2.4), '▼', '#e8b04a');
      else if (o.type === 'crawler' && o.alive){
        const cp = vArc(o.s * OMEGA, R, posOf(o.s).y + 1.5);
        if (o.st === 'windup') drawIcon(cp, '!', '#ff6b5a');
        else if (o.st === 'stunned') drawIcon(cp, 'A', '#e8b04a');
        else if (o.st === 'out' && d < 3) drawIcon(cp, 'A', '#efe6d2');
      }
    }
  }
  if (B && mode === 'boss'){
    const bw = W * 0.7, bx = (W - bw) / 2, by = 66;
    hx.fillStyle = '#efe6d2'; hx.font = '600 14px "Pixelify Sans", sans-serif'; hx.textAlign = 'center';
    hx.fillText(B.name, W / 2, by - 4); hx.textAlign = 'left';
    hx.fillStyle = '#09080c'; hx.fillRect(bx, by, bw, 10);
    hx.fillStyle = B.phase === 2 ? '#d9483b' : '#a07cff'; hx.fillRect(bx + 2, by + 2, (bw - 4) * B.hp / B.max, 6);
    hx.fillStyle = 'rgba(239,230,210,0.5)'; hx.fillRect(bx + bw / 2, by, 2, 10);
    if (B.phase === 1){
      if (B.st === 'tele') drawTiming(B.atk === 'slam' ? '▲' : B.atk === 'sweep' ? '▼' : 'B', B.tm, B.atk === 'spit' ? B.T + 0.5 : B.T);
      if (B.st === 'orb' && B.orb && !B.orb.back) drawTiming('B', B.T + B.orb.t, B.T + B.orb.dur);
      if (B.st === 'stagger'){ const s = toScreen(bossTop()); hx.fillStyle = '#efe6d2'; hx.font = '700 17px "Pixelify Sans", sans-serif'; hx.textAlign = 'center'; hx.fillText('A  strike now', s.x, s.y); hx.textAlign = 'left'; }
    }
  }
  hx.textAlign = 'center';
  for (const f of floats){
    const s = toScreen(_v2.copy(f.p).setY(f.p.y + f.t * 1.2)); if (!s.ok) continue;
    hx.globalAlpha = clamp(1 - f.t / 1.1, 0, 1); hx.font = '700 17px "Pixelify Sans", sans-serif';
    hx.fillStyle = '#09080c'; hx.fillText(f.text, s.x, s.y + 2); hx.fillStyle = f.color; hx.fillText(f.text, s.x, s.y);
  }
  hx.globalAlpha = 1; hx.textAlign = 'left';
  if (toast){
    const a = toast.t < 0.25 ? toast.t / 0.25 : toast.t > toast.dur - 0.4 ? (toast.dur - toast.t) / 0.4 : 1;
    hx.globalAlpha = clamp(a, 0, 1); hx.textAlign = 'center';
    hx.fillStyle = '#09080c'; hx.font = '700 30px "Pixelify Sans", sans-serif'; hx.fillText(toast.text, W / 2, H * 0.2 + 3);
    hx.fillStyle = '#efe6d2'; hx.fillText(toast.text, W / 2, H * 0.2);
    if (toast.sub){ hx.fillStyle = '#c7bed2'; hx.font = '400 15px "Pixelify Sans", sans-serif'; hx.fillText(toast.sub, W / 2, H * 0.2 + 24); }
    hx.textAlign = 'left'; hx.globalAlpha = 1;
  }
  if (hint && mode === 'climb'){
    hx.font = '600 15px "Pixelify Sans", sans-serif';
    const lines = wrap(hint, W - 64), lh = 19, bh = lines.length * lh + 16, by = H - bh - 14;
    hx.fillStyle = 'rgba(9,8,12,0.82)'; hx.fillRect(20, by, W - 40, bh);
    hx.fillStyle = '#e8b04a'; hx.fillRect(20, by, 4, bh);
    hx.fillStyle = '#efe6d2'; lines.forEach((l, i) => hx.fillText(l, 34, by + 22 + i * lh));
  }
  if (mode === 'fall'){
    hx.fillStyle = 'rgba(9,8,12,0.7)'; hx.fillRect(0, H - 44, W, 44);
    hx.fillStyle = '#e8b04a'; hx.font = '600 16px "Pixelify Sans", sans-serif'; hx.textAlign = 'center';
    hx.fillText('Tap ▲ as a root passes your hands', W / 2, H - 17); hx.textAlign = 'left';
  }
}

/* ---------------- main loop ---------------- */
function step(dt){
  time += dt;
  if (toast){ toast.t += dt; if (toast.t > toast.dur) toast = null; }
  for (let i = floats.length - 1; i >= 0; i--){ floats[i].t += dt; if (floats[i].t > 1.1) floats.splice(i, 1); }
  shake *= Math.exp(-dt * 10); if (shake < 0.01) shake = 0;
  dip *= Math.exp(-dt * 14);
  if (flash > 0) flash = Math.max(0, flash - dt); else if (flash < 0) flash = Math.min(0, flash + dt);
  if (G){
    const gdt = mode === 'climb' || mode === 'boss' ? dt : 0;
    G.jump = Math.max(0, G.jump - gdt); G.duck = Math.max(0, G.duck - gdt); G.block = Math.max(0, G.block - gdt);
    G.atk = Math.max(0, G.atk - gdt); G.atkCd = Math.max(0, G.atkCd - gdt); G.inv = Math.max(0, G.inv - gdt);
    G.stumble = Math.max(0, G.stumble - gdt); G.squash = Math.max(0, G.squash - dt * 6); G.grabCd = Math.max(0, G.grabCd - dt);
  }
  if (mode === 'climb') updClimb(dt);
  else if (mode === 'boss') updBoss(dt);
  else if (mode === 'fall') updFall(dt);
  else if (mode === 'pool'){ POOLT += dt; if (POOLT > 1.4){ G.s = 0; G.prevS = 0; poolMenu(); } }
  else if (mode === 'title'){ camAng += dt * 0.12; }
}
function frame(ts){
  const now = ts / 1000;
  let dt = last ? now - last : 0.016; last = now;
  dt = Math.min(dt, 0.05);
  let sdt = dt;
  if (hitstop > 0){ hitstop -= dt; sdt = dt * 0.06; }
  step(sdt);
  updVisuals(sdt);
  renderer.render(scene, camera);
  drawHUD();
  if (G && pipsEl.dataset.v !== String(G.flask) + G.flaskMax){ pipsEl.dataset.v = String(G.flask) + G.flaskMax; updatePips(); }
  requestAnimationFrame(frame);
}

/* ---------------- input ---------------- */
document.querySelectorAll('.btn').forEach(b => {
  const k = b.dataset.k;
  b.addEventListener('pointerdown', e => { e.preventDefault(); b.classList.add('on'); press(k); });
  const up = () => b.classList.remove('on');
  b.addEventListener('pointerup', up); b.addEventListener('pointercancel', up); b.addEventListener('pointerleave', up);
  b.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); press(k); } });
});
document.addEventListener('contextmenu', e => e.preventDefault());
document.addEventListener('visibilitychange', () => { if (document.hidden) save(); });
const keymap = {ArrowUp:'up', w:'up', W:'up', ' ':'up', ArrowDown:'down', s:'down', S:'down', j:'a', J:'a', z:'a', Z:'a', k:'b', K:'b', x:'b', X:'b', f:'flask', F:'flask', q:'flask', Q:'flask'};
window.addEventListener('keydown', e => {
  if (overlay.classList.contains('show')) return;
  const k = keymap[e.key]; if (!k || e.repeat) return;
  e.preventDefault(); press(k);
  const b = document.querySelector(`.btn[data-k="${k}"]`); if (b){ b.classList.add('on'); setTimeout(() => b.classList.remove('on'), 90); }
});

/* ---------------- boot ---------------- */
G = {s: 0, prevS: 0, hp: 5, maxHp: 5, flask: 3, flaskMax: 3, gold: 0, weapon: S.weapon, bonusDmg: 0, hearts: 0, jump: 0, duck: 0, block: 0, lastBlock: -9, atk: 0, atkCd: 0, inv: 0, squash: 0, thudId: null, stumble: 0, campDone: new Set(), zoneShown: 0, grabCd: 0};
setAllFlights();
camY = 3; camAng = 0.3;
titleMenu();
requestAnimationFrame(frame);
})();
</script>
